<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cog 对话</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d14;
  --panel: #141827;
  --line: #262c40;
  --text: #e9ecf5;
  --dim: #9aa3bb;
  --accent: #7aa2ff;
  --warn: #ffb86b;
  --ok: #66d9a3;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  padding-top: env(safe-area-inset-top);
}
header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  position: sticky;
  top: 0;
  z-index: 2;
}
header h1 { font-size: 16px; margin: 0; flex: 1; }
#state { color: var(--dim); font-size: 12px; }
#token-bar {
  display: flex;
  gap: 8px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line);
}
#token-bar.hidden { display: none; }
#token-bar input {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 9px;
}
button {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 11px;
  font: inherit;
}
button.primary { border-color: var(--accent); color: var(--accent); }
button:active { transform: translateY(1px); }
main {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg { max-width: 100%; display: flex; flex-direction: column; gap: 5px; }
.msg.user { align-items: flex-end; }
.bubble {
  padding: 9px 12px;
  border-radius: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user .bubble { background: #1d2a4d; border-bottom-right-radius: 4px; }
.msg.assistant .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.notice .bubble { color: var(--dim); border: 1px dashed var(--line); background: transparent; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px;
  color: var(--accent);
  border: 1px solid #2f3f66;
  background: #101a2e;
  border-radius: 999px;
  padding: 3px 9px;
  text-decoration: none;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.card h2 { margin: 0; font-size: 14px; }
.card p { margin: 0; color: var(--dim); font-size: 13px; white-space: pre-wrap; }
.card ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 12px; }
.card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card .result { color: var(--ok); font-size: 12px; }
footer {
  display: flex;
  gap: 8px;
  padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--panel);
}
footer textarea {
  flex: 1;
  min-height: 38px;
  max-height: 140px;
  resize: none;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 10px;
  font: inherit;
}
#modal {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 12, .72);
  display: flex;
  align-items: stretch;
  justify-content: center;
  z-index: 9;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#modal.hidden { display: none; }
#modal .sheet {
  width: 100%;
  max-width: 720px;
  background: var(--bg);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
#modal .bar { display: flex; justify-content: flex-end; padding: 8px; border-bottom: 1px solid var(--line); }
#modal iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
</style>
</head>
<body>
<header>
  <h1>Cog 对话</h1>
  <span id="state">未连接</span>
</header>
<div id="token-bar">
  <input id="token" type="password" placeholder="observatory-token" autocomplete="off" spellcheck="false">
  <button id="token-save" type="button">保存令牌</button>
</div>
<main id="messages"></main>
<div id="modal" class="hidden">
  <div class="sheet">
    <div class="bar"><button id="modal-close" type="button">关闭</button></div>
    <iframe id="modal-frame" title="保密输入面"></iframe>
  </div>
</div>
<footer>
  <textarea id="text" rows="1" placeholder="发消息"></textarea>
  <button id="send" class="primary" type="button">发送</button>
</footer>
<script src="app.js" type="module"></script>
</body>
</html>
