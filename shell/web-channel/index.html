<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Cog 对话</title>
<style>
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("./fonts/noto-sans-sc-400-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("./fonts/noto-sans-sc-400-chinese-simplified.woff2") format("woff2");
  unicode-range: U+2E80-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
}
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("./fonts/noto-sans-sc-600-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("./fonts/noto-sans-sc-600-chinese-simplified.woff2") format("woff2");
  unicode-range: U+2E80-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
}
@font-face {
  font-family: "Noto Serif SC";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("./fonts/noto-serif-sc-600-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Noto Serif SC";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("./fonts/noto-serif-sc-600-chinese-simplified.woff2") format("woff2");
  unicode-range: U+2E80-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
}
:root {
  color-scheme: light;
  --bg: #f7f4ec;
  --surface: #fffdf8;
  --panel: #fffdf8;
  --panel-2: #f3eee2;
  --line: #e7dfcf;
  --line-soft: #efe8da;
  --text: #2f2a22;
  --dim: #6b6256;
  --accent: #e6c26e;
  --accent-ink: #2b2415;
  --warn: #c46b4f;
  --ok: #4fb286;
  --radius: 14px;
  --stage: 18px;
  --sans: "Noto Sans SC", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", "Noto Serif CJK SC", serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  background: radial-gradient(120% 80% at 50% -10%, var(--surface) 0%, var(--bg) 62%);
  color: var(--text);
  font: 400 15px/1.65 var(--sans);
  padding-top: env(safe-area-inset-top);
  -webkit-font-smoothing: antialiased;
}
::selection { background: #f1dfae; color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 2;
}
header h1 { display: flex; align-items: center; gap: 8px; font: 600 18px/1.2 var(--serif); letter-spacing: 0.02em; margin: 0; flex: 1; }
.brand-mark { width: 22px; height: 22px; flex: none; }
#state {
  color: var(--dim);
  font-size: 11px;
  letter-spacing: 0.04em;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 9px;
}
#token-bar {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
#token-bar.hidden { display: none; }
#token-bar input {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius);
  padding: 9px 12px;
  font: inherit;
}
button {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 13px;
  font: inherit;
  cursor: pointer;
}
button.primary { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); font-weight: 600; }
button:disabled { opacity: 0.48; cursor: not-allowed; }
button:active { transform: translateY(1px); }
main {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg { max-width: 100%; display: flex; gap: 10px; align-items: flex-start; }
.msg.user { justify-content: flex-end; }
.msg-body { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.msg.user .msg-body { align-items: flex-end; max-width: 82%; }
.msg.assistant .msg-body { flex: 1; }
.avatar {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fdf5df;
  border: 1px solid #e8d3a0;
  color: #8a6b1f;
  font: 600 15px/1 var(--serif);
}
.bubble {
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user .bubble {
  padding: 10px 14px;
  border-radius: var(--radius) var(--radius) 4px var(--radius);
  background: #f6e6bb;
  border: 1px solid #ead49c;
}
.msg.assistant .bubble { padding: 2px 0 0; color: var(--text); }
.msg.notice { justify-content: center; }
.msg.notice .bubble {
  color: var(--dim);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  font-size: 13px;
  padding: 6px 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px;
  color: #8a6b1f;
  border: 1px solid #e8d3a0;
  background: #fdf5df;
  border-radius: 999px;
  padding: 3px 10px;
  text-decoration: none;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 12px 30px rgba(80, 65, 30, 0.06);
}
.card h2 { margin: 0; font: 600 15px/1.35 var(--serif); }
.card p { margin: 0; color: var(--dim); font-size: 13px; white-space: pre-wrap; }
.card ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 12px; }
.card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card .result { color: var(--ok); font-size: 12px; }
footer {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
footer textarea {
  flex: 1;
  min-height: 44px;
  max-height: 140px;
  resize: none;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius);
  padding: 10px 14px;
  font: inherit;
}
#send {
  width: 40px;
  height: 40px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 12px;
  font-weight: 600;
  flex: none;
  box-shadow: 0 6px 16px rgba(177, 138, 45, 0.28);
}
#modal {
  position: fixed;
  inset: 0;
  background: rgba(53, 45, 30, 0.36);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: stretch;
  justify-content: center;
  z-index: 9;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#modal.hidden { display: none; }
#modal .sheet {
  width: 100%;
  max-width: 720px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--stage);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#modal .bar { display: flex; justify-content: flex-end; padding: 10px; border-bottom: 1px solid var(--line); }
#modal iframe { flex: 1; width: 100%; border: 0; background: var(--surface); }
@media (max-width: 520px) {
  header { padding: 10px 12px; }
  header h1 { font-size: 17px; }
  main { padding: 14px 12px 22px; }
  footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<header>
  <h1>
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#e6c26e" stroke-width="1.6"><circle cx="12" cy="12" r="2.6" fill="#e6c26e" stroke="none"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(38 12 12)" opacity="0.6"/></g></svg>
    <span>Cog 对话</span>
  </h1>
  <span id="state">未连接</span>
</header>
<div id="token-bar">
  <input id="token" type="password" placeholder="observatory-token" autocomplete="off" spellcheck="false">
  <button id="token-save" type="button">保存令牌</button>
</div>
<main id="messages"></main>
<div id="modal" class="hidden">
  <div class="sheet">
    <div class="bar"><button id="modal-close" type="button">关闭</button></div>
    <iframe id="modal-frame" title="保密输入面"></iframe>
  </div>
</div>
<footer>
  <textarea id="text" rows="1" placeholder="发消息"></textarea>
  <button id="send" class="primary" type="button">发送</button>
</footer>
<script src="app.js" type="module"></script>
</body>
</html>
