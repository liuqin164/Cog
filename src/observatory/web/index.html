  :root {

    --void: #f7f4ec;
    --surface: #fffdf8;

  }
  * { box-sizing: border-box; }

  ::selection { background: #f1dfae; color: var(--ink); }

  }
  .chip:hover { background: var(--panel-2); color: var(--ink); }

  .chip .count { font-family: var(--mono); font-size: var(--step-1); opacity: 0.72; }

  nav.tabs {

    backdrop-filter: blur(10px);

  .legend ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; }
  .legend li { display: inline-flex; align-items: center; gap: 0.3125rem; font-size: var(--step-1); color: var(--ink-dim); }
  .legend-role {
    font: inherit; font-size: var(--step-1); color: var(--ink-dim); background: none; border: none;
    padding: 0; display: inline-flex; align-items: center; gap: 0.3125rem; cursor: pointer;
  }
  .legend-role:hover { color: var(--ink); }
  .legend-role[aria-pressed="false"] { opacity: 0.38; text-decoration: line-through; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px color-mix(in srgb, currentColor 55%, transparent); background: currentColor; }
  .lod-row { display: flex; gap: 0.25rem; align-items: center; flex-wrap: wrap; }
  .lod-row button {

  .notice {

  .notice.hidden { display: none; }

  .hovercard.on { opacity: 1; }
  .hovercard .t { color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .section { padding: 0.875rem 1rem; border-bottom: 1px solid var(--line-soft); }
  .section:last-child { border-bottom: none; }
  h2.head { margin: 0 0 0.5rem; font: 600 var(--step-3)/1.25 var(--serif); letter-spacing: 0.04em; color: var(--ink-dim); }
  h3 { margin: 0 0 0.25rem; font: 600 var(--step-4)/1.35 var(--serif); }

  dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.1875rem 0.75rem; font-size: var(--step-2); }

  code, .cmd { font-family: var(--mono); font-size: var(--step-1); }

  ul.evidence button:hover { color: var(--accent); }
  ul.edges { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.1875rem; }
  ul.edges li { font-size: var(--step-2); display: flex; gap: 0.375rem; align-items: baseline; }
  ul.edges .rel { font-family: var(--mono); font-size: var(--step-1); color: var(--ink-faint); flex: none; }
  ul.edges button { font: inherit; font-size: var(--step-2); color: var(--ink-dim); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  ul.edges button:hover { color: var(--accent); }
  .empty { padding: 1.25rem 1rem; color: var(--ink-dim); font-size: var(--step-3); }

  .skeleton { height: 0.75rem; border-radius: 4px; background: linear-gradient(90deg, #efe8da 25%, #f8f3e8 50%, #efe8da 75%); background-size: 200% 100%; animation: shim 1.4s linear infinite; margin-bottom: 0.5rem; }
  .skeleton.w60 { width: 60%; } .skeleton.w40 { width: 40%; } .skeleton.w80 { width: 80%; }
  @keyframes shim { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  .view { display: none; height: 100%; overflow: auto; }

  .chart-wrap { padding: 1rem; }

  .tl-legend span { display: inline-flex; align-items: center; gap: 0.375rem; }
  .day-panel { padding: 0.5rem 1rem 1.25rem; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }

  ul.plain { margin: 0; padding: 0; list-style: none; font-size: var(--step-2); color: var(--ink-dim); display: flex; flex-direction: column; gap: 0.1875rem; }
  ul.plain li { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px dotted var(--line-soft); padding-bottom: 0.125rem; }
  ul.plain button { font: inherit; color: var(--ink-dim); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); height: 100%; min-height: 0; }
  @media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; } }
  .list { overflow-y: auto; border-right: 1px solid var(--line-soft); min-height: 0; }

    transition: background 140ms ease-out;
  }

  }

  .role-card {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    padding: 0.875rem 1rem; display: flex; flex-direction: column; gap: 0.5rem;
    box-shadow: 0 10px 26px rgba(80, 65, 30, 0.05);
  }
  .role-card header { display: flex; align-items: center; gap: 0.5rem; padding: 0; border: 0; background: none; }
  .role-card .role-name { font: 600 var(--step-4)/1.2 var(--serif); }
  .role-card .role-count { margin-left: auto; font-family: var(--mono); color: var(--ink-dim); }
  .role-bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .role-bar span { display: block; height: 100%; border-radius: inherit; background: currentColor; }
  .role-types { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .role-types span { font-size: var(--step-1); color: var(--ink-dim); background: var(--panel-2); border-radius: 999px; padding: 0.0625rem 0.4375rem; }
  .audit-table { width: 100%; border-collapse: collapse; font-size: var(--step-2); margin-top: 1.25rem; }
  .audit-table th, .audit-table td { text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid var(--line-soft); }
  .audit-table th { color: var(--ink-faint); font-weight: 500; font-size: var(--step-1); letter-spacing: 0.04em; }
  .audit-table td.num { text-align: right; font-family: var(--mono); }

  .round-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0; height: 100%; min-height: 0; }
  @media (max-width: 900px) { .round-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; } }
  .round-list { overflow-y: auto; padding: 1rem; border-right: 1px solid var(--line-soft); min-height: 0; }
  .round-side { overflow-y: auto; padding: 1rem; min-height: 0; }
  .round-item {
    width: 100%; text-align: left; font: inherit; color: var(--ink-dim); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 0.6875rem 0.875rem;
    margin-bottom: 0.5rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.25rem;
  }
  .round-item:hover { border-color: #d9c9a4; background: #fffaf0; }
  .round-item .r { display: flex; align-items: center; gap: 0.5rem; }
  .round-item .r b { color: var(--ink); font-weight: 600; }
  .round-item .r .role-tag { margin-left: auto; }
  .round-item .m { font-family: var(--mono); font-size: var(--step-1); color: var(--ink-faint); }
  .role-tag {
    display: inline-flex; align-items: center; gap: 0.3125rem; font-size: var(--step-1);
    border: 1px solid var(--line); border-radius: 999px; padding: 0.0625rem 0.4375rem; color: var(--ink-dim);
  }
  .role-tag i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
<header>
  <h1 class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#e6c26e" stroke-width="1.6"><circle cx="12" cy="12" r="2.6" fill="#e6c26e" stroke="none"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(38 12 12)" opacity="0.6"/></g></svg>
    Cog 记忆观测台 <small>只读</small>
  </h1>
  <div class="header-group">
    <label class="field">项目 <select id="project-select"></select></label>
  </div>
  <div class="spacer"></div>
  <div class="header-group">
    <span id="source-badge" class="badge badge-live"><span class="dot"></span><span id="source-label">live</span></span>
    <span class="meta" id="waterline"></span>
  </div>
</header>

<div class="scope-bar" id="scope-bar" role="group" aria-label="智能体范围">
  <span class="roster-label">范围</span>
  <button class="chip" id="scope-all" aria-pressed="true">全部<span class="count" id="scope-all-count"></span></button>
  <span id="roster"></span>
</div>

<nav class="tabs" role="tablist" aria-label="观测台页面">
  <button role="tab" id="tab-starmap" aria-controls="view-starmap" aria-selected="true">星图</button>
  <button role="tab" id="tab-timeline" aria-controls="view-timeline" aria-selected="false">时间线</button>
  <button role="tab" id="tab-recalls" aria-controls="view-recalls" aria-selected="false">召回检查</button>
  <button role="tab" id="tab-classification" aria-controls="view-classification" aria-selected="false">分类审计</button>
  <button role="tab" id="tab-round" aria-controls="view-round" aria-selected="false">本轮记忆</button>
  <button role="tab" id="tab-soul" aria-controls="view-soul" aria-selected="false">Soul</button>
  <button role="tab" id="tab-credentials" aria-controls="view-credentials" aria-selected="false">凭据</button>
  <button role="tab" id="tab-health" aria-controls="view-health" aria-selected="false">健康</button>
</nav>

<main>
  <section class="stage" aria-label="星图">
    <div class="view on" id="view-starmap" role="tabpanel" aria-labelledby="tab-starmap" style="height:100%">
      <canvas id="map" tabindex="0" role="application"
        aria-label="三维记忆星图。方向键旋转，加号与减号缩放，回车选中屏幕中央最近的节点，Esc 取消选择。"></canvas>
      <div class="hovercard" id="hovercard" role="presentation"></div>
      <div class="map-overlay">
        <div class="notice hidden" id="truncation-notice"></div>
        <div class="legend" id="legend">
          <h2>图例 · <span id="legend-scope">全部</span></h2>
          <ul id="legend-items"></ul>
          <div class="lod-row" style="margin-top:0.4375rem">
            <span class="hint">LOD 上限</span>
            <button type="button" data-lod="0" aria-pressed="false">L0</button>
            <button type="button" data-lod="1" aria-pressed="false">L0+L1</button>
            <button type="button" data-lod="2" aria-pressed="true">全部</button>
          </div>
          <p class="hint" id="map-stats" style="margin:0.4375rem 0 0"></p>
          <p class="hint" style="margin:0.25rem 0 0">拖动旋转 · 滚轮/捏合缩放 · 悬停查看 · 点选详情<br>缩放会自动淡入 L1、L2。</p>
        </div>
      </div>
    </div>
    <div class="view" id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline"></div>
    <div class="view" id="view-recalls" role="tabpanel" aria-labelledby="tab-recalls"></div>
    <div class="view" id="view-classification" role="tabpanel" aria-labelledby="tab-classification"></div>
    <div class="view" id="view-round" role="tabpanel" aria-labelledby="tab-round"></div>
    <div class="view" id="view-soul" role="tabpanel" aria-labelledby="tab-soul"></div>
    <div class="view" id="view-credentials" role="tabpanel" aria-labelledby="tab-credentials"></div>
    <div class="view" id="view-health" role="tabpanel" aria-labelledby="tab-health"></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
