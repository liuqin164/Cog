:root {
  color-scheme: dark;
  --bg: #0a0f16;
  --bg-soft: #0e151f;
  --panel: #121b28;
  --panel-2: #16222f;
  --line: #223146;
  --line-soft: #1a2839;
  --ink: #e8e4d8;
  --ink-2: #b9c2cd;
  --ink-3: #7e8b9a;
  --gold: #e6c26e;
  --gold-ink: #14100a;
  --gold-soft: rgba(230, 194, 110, .13);
  --teal: #4fb286;
  --teal-soft: rgba(79, 178, 134, .13);
  --coral: #e0655f;
  --coral-soft: rgba(224, 101, 95, .13);
  --sky: #6aa8d8;
  --sky-soft: rgba(106, 168, 216, .13);
  --lav: #b08fd4;
  --lav-soft: rgba(176, 143, 212, .14);
  --slate: #8fa3b8;
  --slate-soft: rgba(143, 163, 184, .13);
  --user-bubble: #1d2c3f;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --radius: 14px;
  --radius-stage: 18px;
  --void: var(--bg);
  --surface: var(--panel);
  --ink-dim: var(--ink-2);
  --ink-faint: var(--ink-3);
  --accent: var(--gold);
  --accent-ink: var(--gold-ink);
  --live: var(--teal);
  --demo: var(--gold);
  --focus: var(--sky);
  --sans: "Noto Sans SC", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", "Noto Serif CJK SC", serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --step-1: 0.75rem;
  --step-2: 0.8125rem;
  --step-3: 0.875rem;
  --step-4: 1rem;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2efe7;
    --bg-soft: #eae6da;
    --panel: #fbf9f3;

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 var(--step-3)/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--gold-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
* { scrollbar-color: var(--line) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border: 3px solid transparent; background-clip: content-box; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }
td, th, .num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 268px minmax(0, 1fr) 330px; height: 100dvh; }
.side { background: var(--bg-soft); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.brand { padding: 20px 20px 6px; }
.brand h1 { font-family: var(--serif); font-weight: 900; font-size: 30px; letter-spacing: .14em; margin: 0; line-height: 1.1; }
.brand .sub { color: var(--ink-3); font-size: 12px; letter-spacing: .3em; margin-top: 4px; }
.companion { margin: 14px 16px 4px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); display: flex; align-items: center; gap: 12px; }
.companion .avatar { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--gold-soft); border: 1px solid var(--gold); color: var(--gold); font: 600 15px/1 var(--serif); }
.companion b { font-size: 14px; display: block; line-height: 1.3; }
.companion span { font-size: 12px; color: var(--ink-3); }
.side-controls { margin: 10px 16px 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.side-controls label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); width: 100%; }
.side-controls select { flex: 1; min-width: 0; }
.side-controls .meta { width: 100%; overflow-wrap: anywhere; }
.nav { padding: 14px 12px 4px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 12px; background: none; border: 0; border-radius: 9px; color: var(--ink-2); font: inherit; font-size: 14.5px; cursor: pointer; text-align: left; min-height: 2.5rem; }
.nav-item:hover { background: var(--panel); color: var(--ink); }
.nav-item[aria-selected="true"] { background: var(--panel-2); color: var(--ink); font-weight: 500; }
.nav .count { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.side .sect { padding: 16px 20px 6px; font-size: 11.5px; letter-spacing: .22em; color: var(--ink-3); }
.books { padding: 0 12px; display: flex; flex-direction: column; gap: 2px; }
.books button { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: none; border: 0; border-radius: 9px; color: var(--ink-2); font: inherit; font-size: 13.5px; cursor: pointer; text-align: left; }
.books button:hover { background: var(--panel); color: var(--ink); }
.books .n { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.chip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor; }
.side .foot { margin-top: auto; padding: 14px 20px 18px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
.chip { font: inherit; font-size: 12px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--ink); border-color: var(--gold); }
.scope-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.side .chip { font: inherit; font-size: 11px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.side .chip[aria-pressed="true"] { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.side .chip .count { font-family: var(--mono); opacity: .72; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 1px solid var(--line-soft); flex: none; }
.topbar .view-title { font-family: var(--serif); font-weight: 600; font-size: 17px; }
.topbar .view-note { color: var(--ink-3); font-size: 12.5px; }
.topbar .spacer { flex: 1; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--panel); border: 1px solid var(--line-soft); color: var(--ink-2); border-radius: 9px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.icon-btn:hover { color: var(--ink); border-color: var(--line); }
.only-mobile { display: none; }
.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.view.on { display: flex; }

.badge { display: inline-flex; align-items: center; gap: .375rem; font-size: 10px; letter-spacing: .02em; text-transform: uppercase; padding: .1875rem .5rem; border-radius: 999px; border: 1px solid transparent; }
.badge-live { color: var(--teal); background: var(--teal-soft); border-color: var(--teal); }
.badge-demo { color: var(--gold); background: var(--gold-soft); border-color: var(--gold); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 0; overflow-wrap: anywhere; }
.meta b { color: var(--ink-2); font-weight: 500; }

.map-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.map-tools { flex: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 22px 10px; align-items: center; }
.map-tools.hidden { display: none; }
.map-tools ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.map-tools li { display: inline-flex; }
.legend-role { font: inherit; font-size: 13px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.legend-role:hover { color: var(--ink); }
.legend-role[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); background: var(--gold-soft); }
.legend-role[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; }
.swatch { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px color-mix(in srgb, currentColor 55%, transparent); background: currentColor; }
.lod-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.lod-row button { font: inherit; font-size: 11px; font-family: var(--mono); color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; cursor: pointer; }
.lod-row button[aria-pressed="true"] { color: var(--gold-ink); border-color: var(--gold); background: var(--gold); }
.lod-row button[aria-pressed="false"] { opacity: 0.5; text-decoration: line-through; }
.notice { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: var(--radius); padding: 8px 12px; font-size: 11px; color: var(--gold); max-width: 24rem; }
.notice.hidden { display: none; }
.hint { font-size: 11px; color: var(--ink-3); }
.map-stage { flex: 1; position: relative; margin: 4px 22px 22px; border-radius: 18px; overflow: hidden; background: radial-gradient(120% 90% at 50% 38%, #0c1830 0%, #071224 46%, #04070f 100%); border: 1px solid var(--line-soft); min-height: 320px; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map:active { cursor: grabbing; }
.hovercard { position: absolute; pointer-events: none; z-index: 5; max-width: 22rem; background: rgba(8, 13, 22, .93); color: #e8e4d8; border: 1px solid #2b3d55; border-radius: 9px; padding: 6px 10px; font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity 120ms ease-out; }
.hovercard.on { opacity: 1; }
.hovercard .t { color: #e8e4d8; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hovercard .s { color: #7e8b9a; font-family: var(--mono); font-size: 11px; }
.map-card { position: absolute; left: 16px; bottom: 16px; z-index: 4; width: min(360px, calc(100% - 32px)); background: rgba(10, 16, 26, .88); color: #e8e4d8; border: 1px solid #2b3d55; border-radius: var(--radius); padding: 14px 16px; backdrop-filter: blur(6px); pointer-events: none; }
.map-card .md-cat { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; }
.map-card h3 { margin: 6px 0 5px; font-size: 15px; line-height: 1.5; }
.map-card p { margin: 0; font-size: 13px; color: #b9c2cd; }
.map-card .mc-meta { margin-top: 9px; font-size: 12px; color: #7e8b9a; }

.insp { border-left: 1px solid var(--line-soft); background: var(--bg-soft); overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.insp-head { padding: 18px 18px 0; }
.insp h2 { font-family: var(--serif); font-size: 15.5px; margin: 0 0 4px; font-weight: 600; }
.insp .note { color: var(--ink-3); font-size: 12.5px; margin: 0 0 12px; }
.insp-close { display: none; position: absolute; top: 12px; right: 12px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); cursor: pointer; }
.mini-map { position: relative; height: 148px; margin: 0 18px 14px; border-radius: var(--radius); overflow: hidden; background: #0a1220; border: 1px solid var(--line-soft); cursor: pointer; }
.mini-map canvas { width: 100%; height: 100%; display: block; }
.mini-map .mm-tag { position: absolute; left: 10px; bottom: 8px; color: #cfd8e3; font-size: 11.5px; background: rgba(6, 10, 16, .55); padding: 2px 8px; border-radius: 999px; }
#panel { flex: 1; min-height: 0; overflow-y: auto; }
.section { padding: 0.875rem 1rem; border-bottom: 1px solid var(--line-soft); }
.section:last-child { border-bottom: none; }
h2.head { margin: 0 0 0.5rem; font: 600 var(--step-3)/1.25 var(--serif); letter-spacing: 0.04em; color: var(--ink-2); }
h3 { margin: 0 0 0.25rem; font: 600 var(--step-4)/1.35 var(--serif); }
p { margin: 0 0 0.5rem; }
p.dim, .dim { color: var(--ink-2); }
.prose { max-width: 68ch; }
dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.1875rem 0.75rem; font-size: var(--step-2); }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; color: var(--ink-2); word-break: break-word; font-variant-numeric: tabular-nums; }
code, .cmd { font-family: var(--mono); font-size: var(--step-1); }
.cmd { display: block; position: relative; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 0.5rem 3.25rem 0.5rem 0.5rem; margin: 0.25rem 0 0.625rem; color: var(--ink-2); white-space: pre-wrap; word-break: break-all; }
.cmd button { position: absolute; top: 0.3rem; right: 0.3rem; font: inherit; font-family: var(--sans); font-size: 11px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0.0625rem 0.375rem; cursor: pointer; }
.cmd button:hover { color: var(--ink); }
ul.plain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.375rem; }
ul.plain li { display: flex; justify-content: space-between; gap: 0.75rem; font-size: var(--step-2); }
ul.plain button { font: inherit; color: var(--ink-2); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
ul.plain button:hover { color: var(--gold); }
ul.edges { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.1875rem; }
ul.edges li { font-size: var(--step-2); display: flex; gap: 0.375rem; align-items: baseline; }
ul.edges .rel { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; }
ul.edges button { font: inherit; font-size: var(--step-2); color: var(--ink-2); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
ul.edges button:hover { color: var(--gold); }
ul.evidence { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.25rem; }
ul.evidence li { font-size: var(--step-2); }
ul.evidence button { font: inherit; font-size: var(--step-2); color: var(--ink-2); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
ul.evidence button:hover { color: var(--gold); }
p.excerpt { margin: 0.25rem 0 0; padding-left: 0.5rem; border-left: 2px solid var(--line); color: var(--ink-2); font-size: var(--step-2); }
.empty { padding: 1.25rem 1rem; color: var(--ink-2); font-size: var(--step-3); }
.empty h3 { font-size: var(--step-4); }
.skeleton { height: 0.75rem; border-radius: 4px; background: linear-gradient(90deg, var(--line-soft) 25%, var(--panel-2) 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: shim 1.4s linear infinite; margin-bottom: 0.5rem; }
.skeleton.w60 { width: 60%; } .skeleton.w40 { width: 40%; } .skeleton.w80 { width: 80%; }
@keyframes shim { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

.audit { padding: 1rem; max-width: 72rem; overflow-y: auto; }
.audit-head { margin: 0 0 1rem; }
.audit-head h2 { margin: 0 0 0.25rem; font: 600 1.375rem/1.3 var(--serif); }
.role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.75rem; }
.role-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 0.875rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; box-shadow: var(--shadow); }
.role-card header { display: flex; align-items: center; gap: 0.5rem; padding: 0; border: 0; background: none; }
.role-card .role-name { font: 600 var(--step-4)/1.2 var(--serif); }
.role-card .role-count { margin-left: auto; font-family: var(--mono); color: var(--ink-2); }
.role-bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.role-bar span { display: block; height: 100%; border-radius: inherit; background: currentColor; }
.role-types { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.role-types span { font-size: 11px; color: var(--ink-2); background: var(--panel-2); border-radius: 999px; padding: 0.0625rem 0.4375rem; }
.audit-table { width: 100%; border-collapse: collapse; font-size: var(--step-2); margin-top: 1.25rem; }
.audit-table th, .audit-table td { text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid var(--line-soft); }
.audit-table th { color: var(--ink-3); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; }
.audit-table td.num { text-align: right; font-family: var(--mono); }

.doc-scroll { flex: 1; overflow-y: auto; padding: 24px 22px 30px; }
.doc-inner { max-width: 720px; margin: 0 auto; }
.doc-inner h2 { font-family: var(--serif); font-weight: 900; font-size: 24px; margin: 0 0 4px; }
.doc-inner .lede { color: var(--ink-3); margin: 0 0 20px; font-size: 13.5px; }
.soul-editor { padding: 1rem; max-width: 64rem; overflow-y: auto; }
.soul-editor h2 { margin: 0 0 0.25rem; font-size: var(--step-4); font-weight: 600; font-family: var(--serif); }
.soul-text { width: 100%; min-height: 14rem; resize: vertical; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.75rem; font: 400 var(--step-3)/1.6 var(--mono); }
.soul-text:focus-visible { border-color: var(--focus); }
.soul-token { width: 8rem; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.5rem 0.75rem; font: 400 var(--step-2)/1.6 var(--mono); }
.soul-toolbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin: 0.5rem 0 1rem; }

.chart-wrap { padding: 1rem; }

.list-item:hover { background: var(--panel); }
.list-item.sel { background: var(--panel-2); }

.round-list { overflow-y: auto; padding: 1rem; border-right: 1px solid var(--line-soft); min-height: 0; }
.round-side { overflow-y: auto; padding: 1rem; min-height: 0; }
.round-item { width: 100%; text-align: left; font: inherit; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.6875rem 0.875rem; margin-bottom: 0.5rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.25rem; }
.round-item:hover { border-color: var(--gold); background: var(--gold-soft); }
.round-item .r { display: flex; align-items: center; gap: 0.5rem; }

.role-tag { display: inline-flex; align-items: center; gap: 0.3125rem; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0.0625rem 0.4375rem; color: var(--ink-2); }
.role-tag i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: var(--panel-2); color: var(--ink); border: 1px solid var(--gold); padding: 11px 20px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60; max-width: calc(100vw - 32px); text-align: center; }

@media (max-width: 1180px) {

  @keyframes insp-in { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }

  .side { display: none; }

  .tabbar button { flex: 1; background: none; border: 0; color: var(--ink-3); font: inherit; font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 7px; cursor: pointer; min-height: 3.2rem; }
  .tabbar button[aria-selected="true"] { color: var(--gold); }

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><h1>星海</h1><div class="sub">OBSERVATORY</div></div>
    <div class="companion">
      <span class="avatar" data-companion-avatar>C</span>
      <div><b data-companion-name>Cog</b><span>同伴 · 常驻</span></div>
    </div>
    <div class="side-controls">
      <label>项目 <select id="project-select"></select></label>
      <span id="source-badge" class="badge badge-live"><span class="dot"></span><span id="source-label">live</span></span>
      <span class="meta" id="waterline"></span>
    </div>
    <nav class="nav" aria-label="主导航">
      <!--ui:tabs-->
      <button class="nav-item" id="tab-starmap" role="tab" aria-controls="view-starmap" aria-selected="false">记忆星图<span class="count">6 类</span></button>
      <button class="nav-item" id="tab-classification" role="tab" aria-controls="view-classification" aria-selected="false">分类审计</button>
      <button class="nav-item" id="tab-soul" role="tab" aria-controls="view-soul" aria-selected="false">灵魂</button>
    </nav>
    <div class="sect">记忆册</div>
    <div class="books" id="sidebar-books"></div>
    <div class="sect">诊断</div>
    <nav class="nav" aria-label="诊断">
      <button class="nav-item" id="tab-timeline" role="tab" aria-controls="view-timeline" aria-selected="false">时间线</button>
      <button class="nav-item" id="tab-recalls" role="tab" aria-controls="view-recalls" aria-selected="false">召回检查</button>
      <button class="nav-item" id="tab-round" role="tab" aria-controls="view-round" aria-selected="false">本轮记忆</button>
      <button class="nav-item" id="tab-credentials" role="tab" aria-controls="view-credentials" aria-selected="false">凭据</button>
      <button class="nav-item" id="tab-health" role="tab" aria-controls="view-health" aria-selected="false">健康</button>
    </nav>
    <div class="foot">
      <div class="scope-row" id="scope-bar">
        <button class="chip" id="scope-all" aria-pressed="true">全部<span class="count" id="scope-all-count"></span></button>
        <span id="roster"></span>
      </div>
      <span>本机 · v5.0</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><div class="view-title" id="view-title">星海</div></div>
      <span class="view-note" id="view-note">对话、星图、审计与灵魂，在一个外壳里切换</span>
      <div class="spacer"></div>
      <button class="icon-btn only-mobile" id="insp-toggle" aria-label="打开本轮记忆面板">本轮记忆</button>
    </header>
    <!--ui:views-->
    <section class="view on" id="view-starmap" role="tabpanel" aria-labelledby="tab-starmap">
      <div class="map-wrap">
        <div class="map-tools" id="legend">
          <ul id="legend-items"></ul>
          <div class="lod-row">
            <span class="hint">LOD</span>
            <button type="button" data-lod="0" aria-pressed="false">L0</button>
            <button type="button" data-lod="1" aria-pressed="false">L0+L1</button>
            <button type="button" data-lod="2" aria-pressed="true">L2</button>
          </div>
          <p class="hint" id="map-stats"></p>
          <div class="notice hidden" id="truncation-notice"></div>
        </div>
        <div class="map-stage">
          <canvas id="map" tabindex="0" role="application" aria-label="三维记忆星图。方向键旋转，加号与减号缩放，回车选中屏幕中央最近的节点，Esc 取消选择。"></canvas>
          <div class="hovercard" id="hovercard" role="presentation"></div>
          <div class="map-card" id="map-card">
            <span class="md-cat" id="map-card-cat"></span>
            <h3 id="map-card-title"></h3>
            <p id="map-card-body"></p>
            <div class="mc-meta" id="map-card-meta"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="view" id="view-classification" role="tabpanel" aria-labelledby="tab-classification"></section>
    <section class="view" id="view-soul" role="tabpanel" aria-labelledby="tab-soul"></section>
    <section class="view" id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline"></section>
    <section class="view" id="view-recalls" role="tabpanel" aria-labelledby="tab-recalls"></section>
    <section class="view" id="view-round" role="tabpanel" aria-labelledby="tab-round"></section>
    <section class="view" id="view-credentials" role="tabpanel" aria-labelledby="tab-credentials"></section>
    <section class="view" id="view-health" role="tabpanel" aria-labelledby="tab-health"></section>
    <nav class="tabbar" aria-label="移动端导航">
      <!--ui:tabbar-->
      <button data-view="starmap">星图</button>
      <button data-view="classification">审计</button>
      <button data-view="soul">灵魂</button>
    </nav>
  </div>
  <aside class="insp" id="inspector" aria-label="本轮记忆面板">
    <button class="insp-close" id="insp-close" aria-label="关闭本轮记忆面板">×</button>
    <div class="insp-head"><h2>记忆星图 · 缩略</h2><p class="note">点开进完整星图。亮起的星，是同伴此刻正用着的记忆。</p></div>
    <div class="mini-map" id="mini-map" role="button" aria-label="打开完整记忆星图" tabindex="0"><canvas id="mini-canvas"></canvas><span class="mm-tag" id="mini-tag"></span></div>
    <div id="panel" aria-live="polite"></div>
  </aside>
</div>
<!--ui:companion-->
<!--ui:assets-->
<script type="module" src="./app.js"></script>
</body>
</html>
