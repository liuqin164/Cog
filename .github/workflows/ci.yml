name: CI

on:
  push:
    # `feat/**` carries the 4.0 line. It had ~40 commits and no CI run before
    # this, so every "tests pass" claim on it came from one local machine.
    branches: [main, 'codex/**', 'feat/**', 't3/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # A doc may say something has not landed only when it names the issue that tracks it.
      - name: Docs "not landed" claims name an issue
        run: |
          if grep -rnE "not landed|has not landed|尚未落地" README.md shell/README.md docs/*.md | grep -vE '#[0-9]+'; then
            echo "::error::a doc claims something has not landed without an issue reference"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Freeze-line budget
        run: bun scripts/budget-check.ts
      - name: Reachability
        run: bun run reachability
      - run: bun run prepublishOnly
      # `shell/` is a private package that lives inside this repo and is deliberately outside the
      # npm tarball (`files` in package.json), so `prepublishOnly` — typecheck, build, test, pack —
      # never sees it. Its suite is a second gate with its own lockfile and its own preload.
      - run: cd shell && bun install --frozen-lockfile
      # The root typecheck covers the root tsconfig, not the shell's own source and tests.
      - run: cd shell && bun run typecheck
      - run: cd shell && bun test test
      # A server left running is invisible to the test runner: every test passes while
      # the process keeps its port and memory. Check after both suites (#244).
      - run: bun run leak:check
